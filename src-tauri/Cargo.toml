[package]
name = "hdu-library-sniper"
version = "2.1.7"
description = "HDU Library Sniper"
authors = ["HDU Library Sniper Contributors"]
edition = "2021"

[lib]
name = "hdu_library_sniper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
axum.workspace = true
tokio.workspace = true
tauri-plugin-notification = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-log = "2.9.1"
tauri-plugin-opener = "2.5.5"
tower = { workspace = true }
log = "0.4.34"

hdu-sniper-auth = { path = "../crates/auth" }
hdu-sniper-server = { path = "../crates/server" }
hdu-sniper-store = { path = "../crates/store" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"

# macOS 没有安装器钩子可以写自启动项：用 LaunchAgent（登录时带 --background 启动）。
# Windows 继续走 NSIS 钩子写 HKCU\...\Run，行为不要动。
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-autostart = "2"
