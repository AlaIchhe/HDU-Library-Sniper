name: Release macOS app

# 没有 Apple Developer Program 会员，所以这里做的是「ad-hoc 签名 + 不公证」的发版：
#   - bundle.macOS.signingIdentity = "-"  → codesign -s -（Apple Silicon 上必须有签名才跑得起来）
#   - 不做 notarization                   → 用户首次打开要在「隐私与安全性」里放行（见 docs/MACOS.md）
# 拿到会员之后只需要：把 sign 步骤换成导入 Developer ID 证书、去掉 signingIdentity，
# 再加上 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 三个环境变量，tauri-action 会自动公证。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal 二进制：两个架构的 std 都要在
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: macos-release

      - run: bun install --frozen-lockfile

      - name: Build universal app and dmg
        env:
          # 更新包用自己的 minisign 密钥签名，和 Apple 证书无关
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun run tauri build --target universal-apple-darwin --bundles app,dmg

      # cargo 的 target 目录在 workspace 根，但不同 tauri 版本下也可能落在 src-tauri 里，两边都找
      - name: Locate the bundles
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          for base in \
            "target/universal-apple-darwin/release/bundle" \
            "src-tauri/target/universal-apple-darwin/release/bundle"; do
            if [ -d "$base/dmg" ] && [ -d "$base/macos" ]; then
              echo "base=$base" >> "$GITHUB_OUTPUT"
              ls -lh "$base/dmg" "$base/macos"
              exit 0
            fi
          done
          echo "no bundle directory found" >&2
          find . -maxdepth 5 \( -name "*.dmg" -o -name "*.app.tar.gz" \) -print >&2
          exit 1

      - name: Show signature state
        run: |
          app="${{ steps.bundle.outputs.base }}/macos/HDU Library Sniper.app"
          echo "--- codesign ---"
          codesign -dv --verbose=4 "$app" 2>&1 | head -20 || true
          echo "--- architectures ---"
          lipo -archs "$app/Contents/MacOS/hdu-library-sniper" || true
          echo "--- gatekeeper ---"
          spctl --assess --type execute --verbose "$app" 2>&1 | head -5 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            ${{ steps.bundle.outputs.base }}/dmg/*.dmg
            ${{ steps.bundle.outputs.base }}/macos/*.app.tar.gz
            ${{ steps.bundle.outputs.base }}/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Wait for the release created by the Windows job
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "release $GITHUB_REF_NAME is ready"
              exit 0
            fi
            sleep 20
          done
          echo "release $GITHUB_REF_NAME never appeared" >&2
          exit 1

      - name: Upload dmg and updater bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="${{ steps.bundle.outputs.base }}"
          gh release upload "$GITHUB_REF_NAME" "$base"/dmg/*.dmg --clobber
          gh release upload "$GITHUB_REF_NAME" "$base"/macos/*.app.tar.gz "$base"/macos/*.app.tar.gz.sig --clobber

      # latest.json 由 Windows 任务生成；这里补上两个 darwin 平台条目，
      # universal 包同时服务 Apple Silicon 和 Intel。
      - name: Add darwin entries to latest.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          dir="$RUNNER_TEMP/updater"
          mkdir -p "$dir"
          for _ in $(seq 1 60); do
            if gh release download "$tag" --pattern latest.json --dir "$dir" --clobber 2>/dev/null; then
              break
            fi
            sleep 20
          done
          test -f "$dir/latest.json"

          tarball=$(ls "${{ steps.bundle.outputs.base }}"/macos/*.app.tar.gz | head -1)
          python3 scripts/patch-latest-json.py "$dir/latest.json" \
            --tarball "$tarball" \
            --url-prefix "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"

          gh release upload "$tag" "$dir/latest.json" --clobber
