name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version matches package version
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          package_version="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/hdu_sniper/__init__.py | head -n 1)"
          lock_version="$(awk '/^name = "hdu-library-sniper"$/{found=1} found && /^version = "([^"]+)"$/{sub(/^version = "/, ""); sub(/"$/, ""); print; exit}' uv.lock)"
          if [[ "$project_version" != "$package_version" ]]; then
            echo "Version mismatch: pyproject.toml=$project_version, src/hdu_sniper/__init__.py=$package_version" >&2
            exit 1
          fi
          if [[ "$project_version" != "$lock_version" ]]; then
            echo "Version mismatch: pyproject.toml=$project_version, uv.lock=$lock_version" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_VERSION" ]]; then
            tag_version="${RELEASE_VERSION#v}"
            if [[ "$tag_version" != "$project_version" ]]; then
              echo "Tag version mismatch: tag=$RELEASE_VERSION, project=$project_version" >&2
              exit 1
            fi
          fi

  build-windows:
    runs-on: windows-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: powershell
        run: scripts\Build-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/*windows*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*Setup*.exe

  build-macos:
    runs-on: macos-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build macOS disk image
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Export release notes from tag message
        shell: bash
        run: |
          git for-each-ref "refs/tags/${{ github.ref_name }}" --format='%(contents:body)' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::warning::Tag message is empty; release notes will be generated by GitHub only."
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: true
