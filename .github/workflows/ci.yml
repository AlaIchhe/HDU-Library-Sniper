name: CI warmup

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: bun install --frozen-lockfile
      - name: Biome（lint + format）
        run: ./node_modules/.bin/biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Rust tests
        run: cargo test -p hdu-sniper-core -p hdu-sniper-hdu -p hdu-sniper-auth -p hdu-sniper-store -p hdu-sniper-server

  warmup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: .
      - run: bun install --frozen-lockfile
      - name: Build frontend and Rust server
        run: |
          npm run build
          cargo build -p hdu-sniper-server
      - name: Warm release build cache
        working-directory: src-tauri
        run: cargo build --release
      - name: Build unsigned MSI (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: bun run tauri build --bundles msi --config src-tauri/tauri.msi.conf.json
      - name: Upload MSI
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: hdu-library-sniper-msi
          path: |
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7