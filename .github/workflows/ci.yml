name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Biome（lint + format）
        run: ./node_modules/.bin/biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Frontend unit tests
        run: bun run test

      - name: Go format
        run: |
          unformatted=$(gofmt -l cmd internal main.go)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Go tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Cross-compile desktop & server targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 windows/amd64 darwin/arm64 darwin/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build . ./cmd/server
          done
          bun run build:web

      - name: Duplication gate
        run: npx --yes jscpd@4 --min-lines 12 --min-tokens 70 --format go,typescript,tsx --threshold 3 --ignore "**/node_modules/**,**/build/**,**/.mygo/**,**/ui/**" src internal cmd
