name: Release Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: src-tauri
          save-if: ${{ github.ref_type == 'branch' }}
      - run: bun install --frozen-lockfile
      - name: Validate updater public key
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw
          if ($config.Contains("__TAURI_UPDATER_PUBLIC_KEY__")) { throw "Set the real updater public key in src-tauri/tauri.conf.json" }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HDU Library Sniper ${{ github.ref_name }}"
          releaseBody: |
            ## 本次更新

            - **修复从 2.0.x MSI 版本升级时的残留**：安装器现在会按控制面板卸载项枚举并卸载旧 MSI，
              不会再出现两个「HDU Library Sniper」条目（残留那条的卸载会误删新版文件）。
              从 2.0.x 升级的用户直接安装新版即可，不需要手动卸载。
            - **新增 macOS 版**（universal，Apple Silicon + Intel 通用）：未做公证，
              首次打开需要在「系统设置 → 隐私与安全性」里点「仍要打开」，详见 docs/MACOS.md。

            Windows 安装包：`*-setup.exe`；macOS 安装包：`*_universal.dmg`。
          args: "--bundles nsis"
          # 直接发布正式 Release：tauri-action 会上传 NSIS 安装包并生成 latest.json，
          # 客户端通过 releases/latest 自动更新即可拉取，无需再手动发布。
          releaseDraft: false
          prerelease: false

      # tauri-action 生成的 latest.json 使用 GitHub API 资产地址。
      # 公开仓库的 API 资产下载有 60 次/小时未认证限流，撞上时客户端会收到 403；
      # 这里统一改写成 releases/download 的浏览器地址，下载不再经过 API。
      - name: Rewrite updater manifest to browser download URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = Join-Path $env:RUNNER_TEMP "updater"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $tag --pattern latest.json --dir $dir --clobber
          $manifestPath = Join-Path $dir "latest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          $installer = $assets.assets | Where-Object { $_.name -like "*-setup.exe" } | Select-Object -First 1
          if (-not $installer) { throw "No NSIS setup.exe asset found on $tag" }
          $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/$($installer.name)"
          # 只改 windows-* 条目：darwin-* 由 macOS 任务写入，并且会指向 .app.tar.gz。
          # 两个任务并发跑，这里如果遍历全部平台会把 macOS 的地址覆盖成 setup.exe。
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            if ($platform.Name -like "windows-*") { $platform.Value.url = $url }
          }
          $apiUrls = $manifest.platforms.PSObject.Properties |
            Where-Object { $_.Name -like "windows-*" -and $_.Value.url -match '/releases/assets/' }
          if ($apiUrls) { throw "latest.json still points at a GitHub API asset URL" }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8
          gh release upload $tag $manifestPath --clobber
