name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package version
        run: |
          pkg_ver=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$pkg_ver" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$pkg_ver"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "HDU Library Sniper $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    if: always() && (github.ref_type != 'tag' || needs.draft-release.result == 'success')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: Windows & Linux, os: ubuntu-latest, platform: "windows/amd64,linux/amd64" }
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install NSIS for Windows installers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build MyGo installers
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATE_PUBLIC_KEY: ${{ vars.MYGO_UPDATE_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          upload_flag=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            upload_flag="-upload"
          fi
          bun run build -- -platform "${{ matrix.platform }}" $upload_flag

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: dist-${{ matrix.name }}
          path: build/

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (pre-release if tag contains '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
