name: Release Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: src-tauri
          save-if: ${{ github.ref_type == 'branch' }}
      - run: bun install --frozen-lockfile
      - name: Validate updater public key
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw
          if ($config.Contains("__TAURI_UPDATER_PUBLIC_KEY__")) { throw "Set the real updater public key in src-tauri/tauri.conf.json" }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "HDU Library Sniper ${{ github.ref_name }}"
          args: "--bundles msi"
          # 直接发布正式 Release：tauri-action 会上传 MSI 并生成 latest.json，
          # 客户端通过 releases/latest 自动更新即可拉取，无需再手动发布。
          releaseDraft: false
          prerelease: false

      # tauri-action 生成的 latest.json 使用 GitHub API 资产地址。
      # 公开仓库的 API 资产下载有 60 次/小时未认证限流，撞上时客户端会收到 403；
      # 这里统一改写成 releases/download 的浏览器地址，下载不再经过 API。
      - name: Rewrite updater manifest to browser download URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = Join-Path $env:RUNNER_TEMP "updater"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $tag --pattern latest.json --dir $dir --clobber
          $manifestPath = Join-Path $dir "latest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $assets = gh release view $tag --json assets | ConvertFrom-Json
          $msi = $assets.assets | Where-Object { $_.name -like "*.msi" } | Select-Object -First 1
          if (-not $msi) { throw "No MSI asset found on $tag" }
          $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/$($msi.name)"
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $platform.Value.url = $url
          }
          $apiUrls = $manifest.platforms.PSObject.Properties | Where-Object { $_.Value.url -match '/releases/assets/' }
          if ($apiUrls) { throw "latest.json still points at a GitHub API asset URL" }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8
          gh release upload $tag $manifestPath --clobber
