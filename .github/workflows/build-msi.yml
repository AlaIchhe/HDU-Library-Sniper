name: Build MSI artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msi-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: msi-artifact
      - run: bun install --frozen-lockfile
      - name: Build unsigned MSI
        shell: pwsh
        run: bun run tauri build --bundles msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: hdu-library-sniper-msi
          path: |
            target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
