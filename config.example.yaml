# HDU 图书馆抢座工具业务配置示例
schema_version: 1

booking:
  max_trials: 5
  retry_delay: 1.0
  dry_run: false
  window_wait_seconds: 30.0
  window_poll_interval: 1.0

notification:
  # 也可通过 HDU_WECHAT_WEBHOOK 环境变量提供
  wechat_webhook: ""

# 自动签到（可选功能，默认关闭）
# 启用必须在应用内阅读并勾选风险协议；协议版本由应用写入。
auto_check_in:
  enabled: false
  agreement_version: ""
  agreed_at: ""
  retry_interval: 120.0
